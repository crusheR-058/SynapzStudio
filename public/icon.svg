<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Synapz">
  <defs>
    <linearGradient id="syn-g" x1="8" y1="6" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF3B4E"/>
      <stop offset="1" stop-color="#B00D22"/>
    </linearGradient>
    <radialGradient id="syn-hl" cx="34%" cy="28%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- tile -->
  <circle cx="32" cy="32" r="32" fill="url(#syn-g)"/>
  <circle cx="32" cy="32" r="32" fill="url(#syn-hl)"/>
  <!-- synapse / waveform: connected neuron-nodes that read as an equalizer pulse -->
  <g stroke="#0f1115" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="#0f1115">
    <!-- dendrite sparks -->
    <path d="M24 26 L20.5 18.5" opacity="0.9"/>
    <path d="M42 24 L46 16" opacity="0.9"/>
    <!-- main neural path -->
    <path d="M14 41 L24 26 L33 35 L42 24 L50 31" fill="none"/>
    <!-- nodes (neurons) -->
    <circle cx="14" cy="41" r="3.6"/>
    <circle cx="24" cy="26" r="4"/>
    <circle cx="33" cy="35" r="3.4"/>
    <circle cx="42" cy="24" r="4"/>
    <circle cx="50" cy="31" r="3.6"/>
    <!-- synapse terminal buttons -->
    <circle cx="20.5" cy="18.5" r="2.2"/>
    <circle cx="46" cy="16" r="2.2"/>
  </g>
</svg>
