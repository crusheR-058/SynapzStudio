<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80" role="img" aria-label="Synapz Studio Music">
  <defs>
    <linearGradient id="syn-g" x1="8" y1="6" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6B85"/>
      <stop offset="1" stop-color="#FF3D57"/>
    </linearGradient>
    <radialGradient id="syn-hl" cx="34%" cy="28%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- dark plate so the mark works on any background -->
  <rect x="0" y="0" width="300" height="80" rx="18" fill="#1a1130"/>

  <!-- mark -->
  <g transform="translate(12,8)">
    <circle cx="32" cy="32" r="32" fill="url(#syn-g)"/>
    <circle cx="32" cy="32" r="32" fill="url(#syn-hl)"/>
    <g stroke="#2a0e16" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="#2a0e16">
      <path d="M24 26 L20.5 18.5" opacity="0.9"/>
      <path d="M42 24 L46 16" opacity="0.9"/>
      <path d="M14 41 L24 26 L33 35 L42 24 L50 31" fill="none"/>
      <circle cx="14" cy="41" r="3.6"/>
      <circle cx="24" cy="26" r="4"/>
      <circle cx="33" cy="35" r="3.4"/>
      <circle cx="42" cy="24" r="4"/>
      <circle cx="50" cy="31" r="3.6"/>
      <circle cx="20.5" cy="18.5" r="2.2"/>
      <circle cx="46" cy="16" r="2.2"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="92" y="44" font-family="Figtree, 'Segoe UI', system-ui, sans-serif"
        font-size="32" font-weight="800" letter-spacing="-1.2" fill="#ffffff">Synapz</text>
  <text x="94" y="62" font-family="Figtree, 'Segoe UI', system-ui, sans-serif"
        font-size="10.5" font-weight="700" letter-spacing="3.6" fill="#FF4D6D">STUDIO · MUSIC</text>
</svg>
