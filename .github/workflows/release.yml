name: Release desktop app

# Cut a release by pushing a version tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
# You can also run it manually from the Actions tab.
#
# Shape: `draft` opens ONE draft release, the matrix jobs build the Windows
# (.exe) and macOS (.dmg) installers and upload straight into it, and `publish`
# flips it visible once every build has landed. Opening the release up front is
# what stops the parallel matrix jobs from racing to create it and splitting the
# assets across duplicate drafts.
#
# Installers deliberately do NOT go through actions/upload-artifact. A release
# is ~440MB of installers across the two runners, and artifact storage on the
# free tier is 500MB — so the round-trip filled the quota and then failed EVERY
# subsequent release at the upload step, long after the builds themselves had
# succeeded. Uploading to the release directly has no such cap.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # let the jobs create and populate the GitHub Release

jobs:
  # Open the release as a draft so users never see a half-populated one, and so
  # the build jobs have a single target to upload into.
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Open the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "release $TAG already exists — reusing it"
            exit 0
          fi
          gh release create "$TAG" --repo "$REPO" --draft \
            --title "Synapz Music $TAG" \
            --notes "Synapz Music desktop app $TAG.

          **Downloads**
          - **Windows:** \`Synapz-Music-Setup-*.exe\`
          - **macOS — Apple Silicon (M1/M2/M3):** \`Synapz-Music-*-arm64.dmg\`
          - **macOS — Intel:** \`Synapz-Music-*-x64.dmg\`

          **Opening it (builds are unsigned):**
          - **Windows:** SmartScreen → *More info* → *Run anyway*.
          - **macOS:** the app is ad-hoc signed, so **right-click the app → Open → Open**. If macOS still says it's \"damaged\", open Terminal and run \`xattr -cr \"/Applications/Synapz Music.app\"\`, then open it."

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            eb_args: --win
            ytdlp_url: https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
            ytdlp_out: bin/yt-dlp.exe
          - os: macos-latest
            # Build BOTH Apple Silicon (arm64) and Intel (x64) .dmgs.
            eb_args: --mac --arm64 --x64
            ytdlp_url: https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
            ytdlp_out: bin/yt-dlp
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # yt-dlp is gitignored, so fetch the right per-OS binary into bin/ — it's
      # copied into the app's resources (powers the keyless YouTube/Bollywood search).
      - name: Fetch yt-dlp
        shell: bash
        run: |
          mkdir -p bin
          curl -L "${{ matrix.ytdlp_url }}" -o "${{ matrix.ytdlp_out }}"
          chmod +x "${{ matrix.ytdlp_out }}" || true

      # Code signing is DORMANT until you add the matching repo secrets. Crucially
      # we set CSC_LINK ONLY when a cert is actually present — an EMPTY CSC_LINK
      # makes electron-builder try to read a cert file and fail ("not a file").
      # With no secrets set, both platforms build UNSIGNED (current behaviour).
      #   Windows: WIN_CSC_LINK (base64 .pfx) + WIN_CSC_KEY_PASSWORD
      #   macOS:   MAC_CSC_LINK (base64 Developer-ID .p12) + MAC_CSC_KEY_PASSWORD
      #   macOS notarize: APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID
      - name: Configure code signing
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ] && [ -n "$WIN_CSC_LINK" ]; then
            echo "CSC_LINK=$WIN_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "signing: windows (cert provided)"
          elif [ "${{ matrix.os }}" = "macos-latest" ] && [ -n "$MAC_CSC_LINK" ]; then
            echo "CSC_LINK=$MAC_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            [ -n "$APPLE_ID" ] && echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
            [ -n "$APPLE_TEAM_ID" ] && echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
            echo "signing: macos (cert provided)"
          else
            # No cert for this OS — force unsigned so macOS doesn't hunt for an identity.
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "signing: none (unsigned build)"
          fi

      - name: Build installer (no publish)
        shell: bash
        env:
          # Baked into the client bundle so the packaged app has cloud sign-in
          # (Supabase). Both are public-safe (anon key is protected by RLS).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # Enables the fast YouTube Data API search path (falls back to yt-dlp).
          # The key is HTTP-referrer-restricted, so it only works from allowed
          # origins — add http://localhost:8787/* to the key's referrers.
          VITE_YOUTUBE_API_KEY: ${{ vars.VITE_YOUTUBE_API_KEY }}
        run: |
          npm run icons
          npm run build
          npx electron-builder ${{ matrix.eb_args }} --publish never

      # Straight into the draft release — no artifact round-trip. latest.yml /
      # latest-mac.yml matter as much as the installers: they're the manifest
      # electron-updater reads to decide an update exists, so a release missing
      # them is invisible to every already-installed copy of the app.
      - name: Upload installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=()
          for f in release/*.exe release/*.dmg release/*.yml release/*.blockmap; do
            base="$(basename "$f")"
            # builder-debug.yml is electron-builder's own scratch output.
            [ "$base" = "builder-debug.yml" ] && continue
            # Upload under the SPACE-FREE name. GitHub rewrites spaces in asset
            # names to dots, while electron-builder writes its own "safe" name
            # (spaces to dashes) into latest.yml as the download URL. Uploading
            # the raw "Synapz Music Setup X.exe" therefore lands an asset that
            # the manifest cannot address, and every auto-update 404s at the
            # download step -- after correctly detecting the new version.
            safe="${base// /-}"
            if [ "$base" != "$safe" ]; then
              mv "$f" "release/$safe"
              f="release/$safe"
            fi
            files+=("$f")
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no installers were produced"
            exit 1
          fi
          printf 'uploading %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber

  # Every installer is in place — make the release visible.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --repo "$REPO" --draft=false
