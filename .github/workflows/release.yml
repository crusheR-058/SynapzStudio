name: Release desktop app

# Cut a release by pushing a version tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
# The matrix jobs BUILD the Windows (.exe) and macOS (.dmg) installers and upload
# them as artifacts; a single `publish` job then creates ONE GitHub Release with
# both. (Publishing from each matrix job in parallel races and splits the assets
# across duplicate draft releases — so we don't do that.) You can also run it
# manually from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # let the publish job create the GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            eb_args: --win
            ytdlp_url: https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
            ytdlp_out: bin/yt-dlp.exe
          - os: macos-latest
            # Build BOTH Apple Silicon (arm64) and Intel (x64) .dmgs.
            eb_args: --mac --arm64 --x64
            ytdlp_url: https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
            ytdlp_out: bin/yt-dlp
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # yt-dlp is gitignored, so fetch the right per-OS binary into bin/ — it's
      # copied into the app's resources (powers the keyless YouTube/Bollywood search).
      - name: Fetch yt-dlp
        shell: bash
        run: |
          mkdir -p bin
          curl -L "${{ matrix.ytdlp_url }}" -o "${{ matrix.ytdlp_out }}"
          chmod +x "${{ matrix.ytdlp_out }}" || true

      - name: Build installer (no publish)
        shell: bash
        env:
          # Code signing — DORMANT until you add the matching repo secrets. The
          # OS-specific ternaries are empty-guarded, so with no secrets set both
          # platforms build UNSIGNED (current behaviour). See README for setup.
          #   Windows: WIN_CSC_LINK (base64 .pfx) + WIN_CSC_KEY_PASSWORD
          #   macOS:   MAC_CSC_LINK (base64 Developer-ID .p12) + MAC_CSC_KEY_PASSWORD
          #   macOS notarize: APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID
          CSC_LINK: ${{ (matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK) || (matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK) || '' }}
          CSC_KEY_PASSWORD: ${{ (matrix.os == 'windows-latest' && secrets.WIN_CSC_KEY_PASSWORD) || (matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD) || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Only let macOS try to auto-sign when a cert is actually provided;
          # otherwise force unsigned so the CI runner doesn't fail hunting for one.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK != '') && 'true' || 'false' }}
        run: |
          npm run icons
          npm run build
          npx electron-builder ${{ matrix.eb_args }} --publish never

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Synapz Music ${{ github.ref_name }}" \
            --notes "Synapz Music desktop app ${{ github.ref_name }}.

          - **Windows:** \`Synapz-Music-Setup-*.exe\`
          - **macOS (Apple Silicon):** \`Synapz-Music-*-arm64.dmg\`

          Builds are unsigned: on first launch, Windows shows SmartScreen (More info -> Run anyway) and macOS shows Gatekeeper (right-click -> Open)." \
            artifacts/*
