# Render Blueprint — one-click deploy of the background-audio backend.
# In the Render dashboard: New → Blueprint → point it at this repo.
# (Render provides $PORT automatically; the server reads process.env.PORT.)
services:
  - type: web
    name: synapz-music
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Signs the session cookie. Render generates a strong random value.
      - key: SESSION_SECRET
        generateValue: true
